<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Web v1</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #1a1d24;
  --surface: #242830;
  --border: #2e333d;
  --text: #e8eaed;
  --muted: #8b929e;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --green: #22c55e;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
.status {
  font-size: .75rem;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 500;
  background: rgba(34,197,94,.15);
  color: var(--green);
}
.status.offline { background: rgba(239,68,68,.15); color: var(--red); }
.status.connecting { background: rgba(59,130,246,.15); color: var(--accent); }
.spacer { flex: 1; min-width: 8px; }
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 7px 14px;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost { background: var(--surface); color: var(--text); }
.btn-ghost:hover { background: #323844; }
.input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: .85rem;
  outline: none;
  width: 100%;
}
.input:focus { border-color: var(--accent); }
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
  overflow: hidden;
  cursor: none;
}
.main.idle { cursor: default; }
#screen {
  max-width: 100%;
  max-height: 100%;
  display: block;
  background: #111;
  user-select: none;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.78);
  z-index: 5;
  padding: 20px;
}
.overlay.hidden { display: none; }
.overlay-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 28px;
  width: min(380px, 100%);
  text-align: center;
}
.overlay-card h2 { font-size: 1.05rem; margin-bottom: 6px; }
.overlay-card p {
  color: var(--muted);
  font-size: .85rem;
  line-height: 1.5;
  margin-bottom: 16px;
}
.field { text-align: left; margin-bottom: 12px; }
.field label {
  display: block;
  font-size: .75rem;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.room {
  font-size: 1.35rem !important;
  padding: 12px !important;
  letter-spacing: 5px;
  text-align: center;
  font-family: monospace;
  font-weight: 600;
}
.err {
  color: var(--red);
  font-size: .8rem;
  min-height: 1.2em;
  margin-top: 8px;
}
.stats {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-size: .7rem;
  color: rgba(255,255,255,.5);
  font-family: monospace;
  pointer-events: none;
}
.tip-bar {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 6px 16px;
  font-size: .75rem;
  color: var(--muted);
  flex-shrink: 0;
}
kbd {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: .7rem;
}
</style>
</head>
<body>
<div class="topbar">
  <h1>Remote Control</h1>
  <div class="status offline" id="status">Offline</div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="fullscreenBtn">Fullscreen</button>
  <button class="btn btn-ghost" id="disconnectBtn" disabled>Disconnect</button>
</div>

<div class="main idle" id="main">
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2>连接远程电脑</h2>
      <p>在被控电脑运行 <code>server.py</code> 并输入房间码后，在此填写<strong>相同房间码</strong>连接。</p>
      <div class="field">
        <label>信令服务器</label>
        <input class="input" id="wsUrl" value="wss://wss.getlost.ovh" readonly>
      </div>
      <div class="field">
        <label>房间码</label>
        <input class="input room" id="roomCode" placeholder="输入房间码" maxlength="32" autocomplete="off">
      </div>
      <button class="btn" id="connectBtn" style="width:100%;margin-top:4px">Connect</button>
      <div class="err" id="errMsg"></div>
    </div>
  </div>
  <canvas id="screen" width="1280" height="720"></canvas>
  <div class="stats" id="stats"></div>
</div>

<div class="tip-bar">
  按 <kbd>Esc</kbd> 紧急断开 · 后台自动保活/重连 · 信令固定为 wss://wss.getlost.ovh
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');
const wsUrlInput = $('wsUrl');
const roomInput = $('roomCode');
const connectBtn = $('connectBtn');
const disconnectBtn = $('disconnectBtn');
const fullscreenBtn = $('fullscreenBtn');
const main = $('main');
const overlay = $('overlay');
const errMsg = $('errMsg');
const canvas = $('screen');
const ctx = canvas.getContext('2d');
const statsEl = $('stats');

/* ===== 固定信令（与文件传输项目一致）===== */
const SIGNALING_URL = 'wss://wss.getlost.ovh';
const PLAYER_ID = 'ctrl-' + Math.random().toString(36).slice(2, 10);
const KEEP_ALIVE_MS = 8000;
const RECONNECT_BASE_MS = 1500;
const RECONNECT_MAX_MS = 12000;
const DISCONNECT_GRACE_MS = 18000;
const CONNECT_TIMEOUT_MS = 20000;
const MOUSE_THROTTLE = 40;

let ws = null;
let meta = { width: 1920, height: 1080, scale: 0.45 };
let connected = false;
let wantConnected = false;   // 用户希望保持连接（用于自动重连）
let currentRoom = '';
let hostId = '';
let frames = 0;
let lastFpsTime = performance.now();
let fps = 0;
let lastMouseSend = 0;
let lastFrameAt = 0;
let keepAliveTimer = null;
let reconnectTimer = null;
let disconnectTimer = null;
let connectTimeout = null;
let reconnectAttempt = 0;
let intentionalClose = false;

// 强制使用公网信令，清掉旧版缓存的 127.0.0.1 / localhost
(function initUrl() {
  wsUrlInput.value = SIGNALING_URL;
  localStorage.setItem('remote_ws_url', SIGNALING_URL);
  const savedRoom = localStorage.getItem('remote_room') || '';
  // 忽略以前误存的本地地址相关房间也可保留房间码
  roomInput.value = savedRoom;
})();

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}
function setError(msg) {
  errMsg.textContent = msg || '';
}

function clearTimers() {
  if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
  if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
}

function cancelDisconnectTimer() {
  if (disconnectTimer) {
    clearTimeout(disconnectTimer);
    disconnectTimer = null;
  }
}

function startKeepAlive() {
  if (keepAliveTimer) clearInterval(keepAliveTimer);
  keepAliveTimer = setInterval(() => {
    if (ws && ws.readyState === 1) {
      try {
        ws.send(JSON.stringify({
          kind: 'ping',
          roomId: currentRoom,
          from: PLAYER_ID,
          to: hostId || undefined,
          payload: { t: Date.now() }
        }));
      } catch {}
    }
  }, KEEP_ALIVE_MS);
}

function scheduleReconnect() {
  if (!wantConnected || intentionalClose) return;
  if (reconnectTimer) return;
  const delay = Math.min(RECONNECT_MAX_MS, RECONNECT_BASE_MS * Math.pow(1.6, reconnectAttempt));
  reconnectAttempt++;
  setStatus('重连中…', 'connecting');
  setError('连接中断，正在重连 (' + reconnectAttempt + ')…');
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (wantConnected && !intentionalClose) connect(true);
  }, delay);
}

function scheduleDisconnectGrace(reason) {
  if (disconnectTimer) return;
  disconnectTimer = setTimeout(() => {
    disconnectTimer = null;
    if (connected && ws && ws.readyState === 1) return;
    // 宽限期后仍未恢复 → 进入重连
    connected = false;
    hostId = '';
    setStatus('连接中断', 'offline');
    scheduleReconnect();
  }, DISCONNECT_GRACE_MS);
}

function sendSignal(kind, payload, to) {
  if (!ws || ws.readyState !== 1) return;
  const msg = { kind, roomId: currentRoom, from: PLAYER_ID };
  if (to) msg.to = to;
  if (payload !== undefined) msg.payload = payload;
  try { ws.send(JSON.stringify(msg)); } catch {}
}

function markConnected(fromId) {
  if (fromId) hostId = fromId;
  const was = connected;
  connected = true;
  reconnectAttempt = 0;
  cancelDisconnectTimer();
  setStatus('Connected', '');
  connectBtn.disabled = false;
  connectBtn.textContent = 'Connect';
  disconnectBtn.disabled = false;
  overlay.classList.add('hidden');
  main.classList.remove('idle');
  setError('');
  startKeepAlive();
  if (!was) canvas.focus();
}

function hardDisconnect(reason, allowReconnect) {
  clearTimers();
  connected = false;
  hostId = '';
  if (ws) {
    intentionalClose = !allowReconnect;
    try { ws.close(); } catch {}
    ws = null;
  }
  setStatus(reason || 'Offline', 'offline');
  connectBtn.disabled = false;
  connectBtn.textContent = 'Connect';
  disconnectBtn.disabled = true;
  overlay.classList.remove('hidden');
  main.classList.add('idle');
  if (reason) setError(reason);
  if (allowReconnect && wantConnected) scheduleReconnect();
}

function disconnect(reason) {
  // 用户主动断开 / Esc
  wantConnected = false;
  intentionalClose = true;
  hardDisconnect(reason || '已断开', false);
}

function connect(isRetry) {
  intentionalClose = false;
  wantConnected = true;
  clearTimers();

  if (ws) {
    try { ws.close(); } catch {}
    ws = null;
  }

  const url = SIGNALING_URL; // 强制公网信令
  wsUrlInput.value = url;
  const room = roomInput.value.trim();
  if (!room || room.length < 4) {
    setError('请输入至少4位房间码');
    roomInput.focus();
    wantConnected = false;
    return;
  }

  localStorage.setItem('remote_ws_url', SIGNALING_URL);
  localStorage.setItem('remote_room', room);
  currentRoom = room;
  setError(isRetry ? '正在重连…' : '');
  setStatus(isRetry ? '重连中…' : 'Connecting…', 'connecting');
  connectBtn.disabled = true;
  connectBtn.textContent = 'Connecting…';

  try {
    ws = new WebSocket(url);
  } catch (e) {
    hardDisconnect('连接失败', true);
    return;
  }

  connectTimeout = setTimeout(() => {
    if (!connected) hardDisconnect('连接失败', true);
  }, CONNECT_TIMEOUT_MS);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      kind: 'register',
      roomId: currentRoom,
      from: PLAYER_ID,
      announce: true
    }));
    setStatus('等待主机…', 'connecting');
    startKeepAlive();
  };

  ws.onclose = () => {
    clearTimeout(connectTimeout);
    connectTimeout = null;
    if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
    ws = null;
    if (intentionalClose) {
      connected = false;
      return;
    }
    if (connected) {
      // 已连上过：先宽限，再重连（家庭 WiFi / 切后台常见）
      connected = false;
      setStatus('连接中断', 'offline');
      scheduleDisconnectGrace('信令断开');
      scheduleReconnect();
    } else {
      hardDisconnect('连接失败', true);
    }
  };

  ws.onerror = () => {
    // onclose 会接着处理
    if (!connected) setError('连接失败');
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') return;
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }

    if (m.sys === 'error' || m.type === 'error') {
      hardDisconnect('连接失败', false);
      wantConnected = false;
      return;
    }

    // 心跳回包
    if (m.kind === 'pong' || m.kind === 'ping') {
      cancelDisconnectTimer();
      return;
    }

    if (m.sys === 'roster') {
      const roster = m.roster || [];
      const others = roster.filter(id => id !== PLAYER_ID);
      if (!others.length) {
        if (connected) {
          // 主机暂时离开，宽限等待
          scheduleDisconnectGrace('主机离开房间');
        } else {
          setStatus('等待主机…', 'connecting');
        }
        return;
      }
      hostId = others.find(id => String(id).startsWith('host-')) || others[0];
      cancelDisconnectTimer();
      if (!connected) {
        clearTimeout(connectTimeout);
        markConnected(hostId);
      } else {
        hostId = hostId;
        setStatus('Connected', '');
      }
      return;
    }

    if (m.from === PLAYER_ID) return;

    const kind = m.kind;
    if (kind === 'meta') {
      const p = m.payload || {};
      if (p.width) meta.width = p.width;
      if (p.height) meta.height = p.height;
      if (p.scale) meta.scale = p.scale;
      if (m.from) hostId = m.from;
      return;
    }

    if (kind === 'frame') {
      const p = m.payload || {};
      if (p.width) meta.width = p.width;
      if (p.height) meta.height = p.height;
      if (p.scale) meta.scale = p.scale;
      if (m.from) hostId = m.from;
      if (!p.data) return;

      lastFrameAt = Date.now();
      cancelDisconnectTimer();

      const bin = atob(p.data);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        if (canvas.width !== img.width || canvas.height !== img.height) {
          canvas.width = img.width;
          canvas.height = img.height;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        frames++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          fps = frames;
          frames = 0;
          lastFpsTime = now;
          statsEl.textContent = `${fps} FPS · ${canvas.width}×${canvas.height} · remote ${meta.width}×${meta.height}`;
        }
      };
      img.src = url;

      if (!connected) {
        clearTimeout(connectTimeout);
        markConnected(m.from || hostId);
      }
      return;
    }
  };
}

connectBtn.addEventListener('click', () => connect(false));
disconnectBtn.addEventListener('click', () => disconnect('已断开'));
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(false); });

fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) main.requestFullscreen?.();
  else document.exitFullscreen?.();
});

function canvasToRemote(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  return {
    x: Math.round(cx / meta.scale),
    y: Math.round(cy / meta.scale)
  };
}

function sendInput(obj) {
  if (!connected || !hostId) return;
  sendSignal('input', obj, hostId);
}

canvas.addEventListener('mousemove', (e) => {
  if (!connected) return;
  const now = performance.now();
  if (now - lastMouseSend < MOUSE_THROTTLE) return;
  lastMouseSend = now;
  const { x, y } = canvasToRemote(e);
  sendInput({ type: 'mouse', x, y });
});

canvas.addEventListener('mousedown', (e) => {
  if (!connected) return;
  e.preventDefault();
  const { x, y } = canvasToRemote(e);
  const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
  sendInput({ type: 'click', x, y, button, clicks: 1 });
});

canvas.addEventListener('dblclick', (e) => {
  if (!connected) return;
  e.preventDefault();
  const { x, y } = canvasToRemote(e);
  sendInput({ type: 'click', x, y, button: 'left', clicks: 2 });
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  if (!connected) return;
  e.preventDefault();
  sendInput({ type: 'scroll', dy: e.deltaY > 0 ? -3 : 3 });
}, { passive: false });

/* Esc = 紧急断开（与文件传输项目的明确用户意图一致）*/
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    if (wantConnected || connected || (ws && ws.readyState === 1)) {
      disconnect('紧急断开');
    }
    return;
  }
  if (!connected) return;
  if (e.target === wsUrlInput || e.target === roomInput) return;
  e.preventDefault();
  sendInput({ type: 'keydown', key: e.key });
}, true);

window.addEventListener('keyup', (e) => {
  if (e.key === 'Escape') return;
  if (!connected) return;
  if (e.target === wsUrlInput || e.target === roomInput) return;
  e.preventDefault();
  sendInput({ type: 'keyup', key: e.key });
}, true);

/* 后台/前台恢复（对齐 web1 文件传输）*/
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  // 回到前台：立即 ping，必要时重连
  if (ws && ws.readyState === 1) {
    try {
      ws.send(JSON.stringify({
        kind: 'ping',
        roomId: currentRoom,
        from: PLAYER_ID,
        to: hostId || undefined,
        payload: { t: Date.now(), resume: true }
      }));
    } catch {}
    cancelDisconnectTimer();
  } else if (wantConnected && !intentionalClose) {
    scheduleReconnect();
  }
});

window.addEventListener('online', () => {
  if (wantConnected && (!ws || ws.readyState !== 1)) scheduleReconnect();
});

window.addEventListener('pagehide', () => {
  if (ws && ws.readyState === 1) {
    try {
      ws.send(JSON.stringify({
        kind: 'ping',
        roomId: currentRoom,
        from: PLAYER_ID,
        payload: { t: Date.now(), pagehide: true }
      }));
    } catch {}
  }
});
</script>
</body>
</html>
