<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Web v6</title>
<style>
:root {
  --bg: #0f1115; --panel: #1a1d24; --surface: #242830; --border: #2e333d;
  --text: #e8eaed; --muted: #8b929e; --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; touch-action: manipulation;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; position: fixed; inset: 0;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.topbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; z-index: 10; flex-wrap: wrap;
}
.topbar h1 { font-size: 1rem; font-weight: 600; }
.status {
  font-size: .75rem; padding: 3px 10px; border-radius: 999px; font-weight: 500;
  background: rgba(34,197,94,.15); color: var(--green);
}
.status.offline { background: rgba(239,68,68,.15); color: var(--red); }
.status.connecting { background: rgba(59,130,246,.15); color: var(--accent); }
.spacer { flex: 1; min-width: 8px; }
.btn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 7px 14px; font-size: .85rem; font-weight: 500; cursor: pointer;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost { background: var(--surface); color: var(--text); }
.input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: 7px 10px; font-size: .85rem; outline: none; width: 100%;
}
.input:focus { border-color: var(--accent); }
.main {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  background: #000; position: relative; overflow: hidden; cursor: none;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.main.idle { cursor: default; }
#screen {
  max-width: 100%; max-height: 100%; display: block; background: #111;
  touch-action: none; -webkit-user-select: none;
}
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.78); z-index: 5; padding: 20px;
}
.overlay.hidden { display: none; }
.overlay-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px 28px; width: min(380px, 100%); text-align: center;
}
.overlay-card h2 { font-size: 1.05rem; margin-bottom: 6px; }
.overlay-card p { color: var(--muted); font-size: .85rem; line-height: 1.5; margin-bottom: 16px; }
.field { text-align: left; margin-bottom: 12px; }
.field label {
  display: block; font-size: .75rem; color: var(--muted); margin-bottom: 4px;
  font-weight: 600; text-transform: uppercase;
}
.room {
  font-size: 1.35rem !important; padding: 12px !important; letter-spacing: 5px;
  text-align: center; font-family: monospace; font-weight: 600;
}
.err { color: var(--red); font-size: .8rem; min-height: 1.2em; margin-top: 8px; }
.stats {
  position: absolute; bottom: 8px; left: 12px; font-size: .7rem;
  color: rgba(255,255,255,.5); font-family: monospace; pointer-events: none; z-index: 6;
}
.tip-bar {
  background: var(--panel); border-top: 1px solid var(--border);
  padding: 6px 16px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  font-size: .75rem; color: var(--muted); flex-shrink: 0;
}
kbd {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 5px; font-size: .7rem;
}

/* 触摸控件：仅 移动端 + 已出画 */
.touch-layer {
  display: none !important; position: absolute; inset: 0; z-index: 20; pointer-events: none;
}
html.is-mobile.is-connected .touch-layer { display: block !important; }
.joy-zone, .btn-zone {
  position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  pointer-events: auto; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.joy-zone { left: 16px; width: 148px; height: 148px; z-index: 21; }
.joy-base {
  width: 148px; height: 148px; border-radius: 50%;
  background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35);
  position: relative;
}
.joy-stick {
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(59,130,246,.9); border: 2px solid rgba(255,255,255,.55);
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.45);
}
.btn-zone {
  right: 14px; display: flex; flex-direction: column; gap: 14px;
  align-items: flex-end; z-index: 21;
}
.touch-btn {
  width: 76px; height: 76px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35); background: rgba(30,30,40,.72);
  color: #fff; font-size: .9rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.touch-btn:active, .touch-btn.active {
  background: rgba(59,130,246,.85); transform: scale(0.94);
}
.touch-btn.right-btn {
  width: 68px; height: 68px; font-size: .8rem; background: rgba(80,30,30,.75);
}
.touch-btn.right-btn:active, .touch-btn.right-btn.active { background: rgba(239,68,68,.8); }
.touch-btn.scroll-btn { width: 52px; height: 42px; border-radius: 12px; font-size: .85rem; }
.scroll-row { display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Remote Control</h1>
  <div class="status offline" id="status">Offline</div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="fullscreenBtn">Fullscreen</button>
  <button class="btn btn-ghost" id="disconnectBtn" disabled>Disconnect</button>
</div>

<div class="main idle" id="main">
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2>连接远程电脑</h2>
      <p>被控端运行 <code>server.py</code> 并输入房间码后，在此填写<strong>相同房间码</strong>。</p>
      <div class="field">
        <label>信令服务器</label>
        <input class="input" id="wsUrl" value="wss://wss.getlost.ovh" readonly>
      </div>
      <div class="field">
        <label>房间码</label>
        <input class="input room" id="roomCode" placeholder="输入房间码" maxlength="32" autocomplete="off">
      </div>
      <button class="btn" id="connectBtn" style="width:100%;margin-top:4px">Connect</button>
      <div class="err" id="errMsg"></div>
    </div>
  </div>
  <canvas id="screen" width="1280" height="720"></canvas>
  <div class="touch-layer" id="touchLayer">
    <div class="joy-zone" id="joyZone">
      <div class="joy-base" id="joyBase"><div class="joy-stick" id="joyStick"></div></div>
    </div>
    <div class="btn-zone">
      <div class="scroll-row">
        <button type="button" class="touch-btn scroll-btn" id="scrollUp">↑</button>
        <button type="button" class="touch-btn scroll-btn" id="scrollDown">↓</button>
      </div>
      <button type="button" class="touch-btn right-btn" id="btnRight">右键</button>
      <button type="button" class="touch-btn" id="btnLeft">左键</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="tip-bar">
  双通道：画面 / 控制分离 · 手机出画后显示摇杆 · <kbd>Esc</kbd> 紧急断开
</div>

<script>
const $ = id => document.getElementById(id);
const SIGNALING = 'wss://wss.getlost.ovh';
const uid = Math.random().toString(36).slice(2, 9);
const ID_VIEW = 'view-' + uid;   // 收画面
const ID_PAD  = 'pad-' + uid;    // 发控制

(function detectMobile() {
  const ua = navigator.userAgent || '';
  const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const mobileUA = /iPhone|iPad|iPod|Android|Mobile/i.test(ua);
  const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  const isMobile = mobileUA || iPadOS || (touch && Math.min(screen.width, screen.height) <= 900);
  document.documentElement.classList.add(isMobile ? 'is-mobile' : 'is-desktop');
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
})();

const statusEl = $('status'), roomInput = $('roomCode'), connectBtn = $('connectBtn');
const disconnectBtn = $('disconnectBtn'), main = $('main'), overlay = $('overlay');
const errMsg = $('errMsg'), canvas = $('screen'), ctx = canvas.getContext('2d');
const statsEl = $('stats');

let wsMedia = null, wsCtrl = null;
let meta = { width: 1920, height: 1080, scale: 0.4 };
let connected = false, hasFrame = false, wantConnected = false;
let currentRoom = '';
let hostMediaId = '', hostCtrlId = '';
let frames = 0, fps = 0, lastFpsTime = performance.now();
let intentionalClose = false;
let keepAliveTimer = null, reconnectTimer = null, connectTimeout = null;
let reconnectAttempt = 0;
let lastMouseSend = 0;

roomInput.value = localStorage.getItem('remote_room') || '';
$('wsUrl').value = SIGNALING;

function setStatus(t, c) { statusEl.textContent = t; statusEl.className = 'status ' + (c || ''); }
function setError(m) { errMsg.textContent = m || ''; }
function setConnectedUI(on) {
  document.documentElement.classList.toggle('is-connected', !!on);
}

function clearTimers() {
  [keepAliveTimer, reconnectTimer, connectTimeout].forEach(t => { if (t) clearTimeout(t); });
  if (keepAliveTimer) clearInterval(keepAliveTimer);
  keepAliveTimer = reconnectTimer = connectTimeout = null;
}

function sendOn(ws, kind, from, payload, to) {
  if (!ws || ws.readyState !== 1) return false;
  const msg = { kind, roomId: currentRoom, from };
  if (to) msg.to = to;
  if (payload !== undefined) msg.payload = payload;
  try { ws.send(JSON.stringify(msg)); return true; } catch { return false; }
}

function sendInput(obj) {
  if (!wsCtrl || wsCtrl.readyState !== 1) return;
  if (!hasFrame && !connected) return;
  const payload = Object.assign({ t: Date.now() }, obj);
  // 控制通道专用：定向 host-c + 广播
  if (hostCtrlId) sendOn(wsCtrl, 'ctrl', ID_PAD, payload, hostCtrlId);
  sendOn(wsCtrl, 'ctrl', ID_PAD, payload, undefined);
  sendOn(wsCtrl, 'input', ID_PAD, payload, hostCtrlId || undefined);
}

function markReady() {
  connected = true;
  reconnectAttempt = 0;
  setStatus('Connected', '');
  connectBtn.disabled = false;
  connectBtn.textContent = 'Connect';
  disconnectBtn.disabled = false;
  overlay.classList.add('hidden');
  main.classList.remove('idle');
  setError('');
  if (hasFrame) setConnectedUI(true);
  startKeepAlive();
}

function hardDisconnect(reason, allowReconnect) {
  clearTimers();
  connected = false;
  hasFrame = false;
  hostMediaId = hostCtrlId = '';
  setConnectedUI(false);
  intentionalClose = !allowReconnect;
  try { wsMedia && wsMedia.close(); } catch {}
  try { wsCtrl && wsCtrl.close(); } catch {}
  wsMedia = wsCtrl = null;
  setStatus(reason || 'Offline', 'offline');
  connectBtn.disabled = false;
  connectBtn.textContent = 'Connect';
  disconnectBtn.disabled = true;
  overlay.classList.remove('hidden');
  main.classList.add('idle');
  if (reason) setError(reason);
  if (allowReconnect && wantConnected) scheduleReconnect();
}

function disconnect(reason) {
  wantConnected = false;
  intentionalClose = true;
  hardDisconnect(reason || '已断开', false);
}

function scheduleReconnect() {
  if (!wantConnected || intentionalClose || reconnectTimer) return;
  const delay = Math.min(12000, 1500 * Math.pow(1.5, reconnectAttempt++));
  setStatus('重连中…', 'connecting');
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(true); }, delay);
}

function startKeepAlive() {
  if (keepAliveTimer) clearInterval(keepAliveTimer);
  keepAliveTimer = setInterval(() => {
    sendOn(wsCtrl, 'ping', ID_PAD, { t: Date.now() }, hostCtrlId || undefined);
    sendOn(wsMedia, 'ping', ID_VIEW, { t: Date.now() }, hostMediaId || undefined);
  }, 8000);
}

function openSocket(url, fromId, onMsg) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const ws = new WebSocket(url);
    ws.onopen = () => {
      ws.send(JSON.stringify({ kind: 'register', roomId: currentRoom, from: fromId, announce: true }));
      if (!settled) { settled = true; resolve(ws); }
    };
    ws.onerror = () => { if (!settled) { settled = true; reject(new Error('ws error')); } };
    ws.onmessage = onMsg;
    ws.onclose = () => {
      if (!intentionalClose && wantConnected) scheduleReconnect();
    };
  });
}

function handleRoster(m, role) {
  const roster = m.roster || [];
  const others = roster.filter(id => id !== ID_VIEW && id !== ID_PAD);
  if (role === 'media') {
    const hid = others.find(id => String(id).startsWith('host-m-')) ||
                others.find(id => String(id).startsWith('host-m')) ||
                others.find(id => String(id).startsWith('host-'));
    if (hid) hostMediaId = String(hid);
  } else {
    const hid = others.find(id => String(id).startsWith('host-c-')) ||
                others.find(id => String(id).startsWith('host-c')) ||
                others.find(id => String(id).startsWith('host-'));
    if (hid) hostCtrlId = String(hid);
  }
  if (hostMediaId && hostCtrlId && !hasFrame) {
    setStatus('等待画面…', 'connecting');
    overlay.classList.add('hidden');
    main.classList.remove('idle');
    disconnectBtn.disabled = false;
  }
}

function onMediaMessage(ev) {
  if (typeof ev.data !== 'string') return;
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.sys === 'roster') { handleRoster(m, 'media'); return; }
  if (m.from === ID_VIEW || m.from === ID_PAD) return;
  if (m.from && String(m.from).startsWith('host-m')) hostMediaId = String(m.from);
  if (m.from && String(m.from).startsWith('host-')) hostMediaId = hostMediaId || String(m.from);

  if (m.kind === 'meta') {
    const p = m.payload || {};
    if (p.width) meta.width = p.width;
    if (p.height) meta.height = p.height;
    if (p.scale) meta.scale = p.scale;
    return;
  }
  if (m.kind !== 'frame') return;
  const p = m.payload || {};
  if (p.width) meta.width = p.width;
  if (p.height) meta.height = p.height;
  if (p.scale) meta.scale = p.scale;
  if (!p.data) return;
  let arr;
  try {
    const bin = atob(p.data);
    arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  } catch { return; }
  const url = URL.createObjectURL(new Blob([arr], { type: 'image/jpeg' }));
  const img = new Image();
  img.onload = () => {
    if (canvas.width !== img.width || canvas.height !== img.height) {
      canvas.width = img.width; canvas.height = img.height;
    }
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    frames++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fps = frames; frames = 0; lastFpsTime = now;
      statsEl.textContent = fps + ' FPS · ' + canvas.width + '×' + canvas.height +
        ' · ctrl:' + (wsCtrl && wsCtrl.readyState === 1 ? 'on' : 'off');
    }
    if (!hasFrame) {
      hasFrame = true;
      markReady();
    } else {
      setConnectedUI(true);
      connected = true;
    }
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

function onCtrlMessage(ev) {
  if (typeof ev.data !== 'string') return;
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.sys === 'roster') { handleRoster(m, 'ctrl'); return; }
  if (m.from && String(m.from).startsWith('host-c')) hostCtrlId = String(m.from);
  if (m.from && String(m.from).startsWith('host-') && !hostCtrlId) hostCtrlId = String(m.from);
}

async function connect(isRetry) {
  intentionalClose = false;
  wantConnected = true;
  clearTimers();
  try { wsMedia && wsMedia.close(); } catch {}
  try { wsCtrl && wsCtrl.close(); } catch {}
  wsMedia = wsCtrl = null;
  hasFrame = false;
  setConnectedUI(false);
  hostMediaId = hostCtrlId = '';

  const room = roomInput.value.trim();
  if (!room || room.length < 4) {
    setError('请输入至少4位房间码');
    wantConnected = false;
    return;
  }
  localStorage.setItem('remote_room', room);
  currentRoom = room;
  setError(isRetry ? '正在重连…' : '');
  setStatus(isRetry ? '重连中…' : 'Connecting…', 'connecting');
  connectBtn.disabled = true;
  connectBtn.textContent = 'Connecting…';

  connectTimeout = setTimeout(() => {
    if (!hasFrame) hardDisconnect('连接失败', true);
  }, 25000);

  try {
    wsMedia = await openSocket(SIGNALING, ID_VIEW, onMediaMessage);
    wsCtrl  = await openSocket(SIGNALING, ID_PAD, onCtrlMessage);
    setStatus('等待主机…', 'connecting');
    startKeepAlive();
  } catch (e) {
    hardDisconnect('连接失败', true);
  }
}

connectBtn.onclick = () => connect(false);
disconnectBtn.onclick = () => disconnect('已断开');
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(false); });
$('fullscreenBtn').onclick = () => {
  if (!document.fullscreenElement) main.requestFullscreen?.();
  else document.exitFullscreen?.();
};

function canvasToRemote(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
  return { x: Math.round(cx / (meta.scale || 0.4)), y: Math.round(cy / (meta.scale || 0.4)) };
}

canvas.addEventListener('mousemove', e => {
  if (!hasFrame) return;
  const now = performance.now();
  if (now - lastMouseSend < 30) return;
  lastMouseSend = now;
  const { x, y } = canvasToRemote(e);
  curX = x; curY = y;
  sendInput({ type: 'mouse', x, y });
});
canvas.addEventListener('mousedown', e => {
  if (!hasFrame) return;
  e.preventDefault();
  const { x, y } = canvasToRemote(e);
  curX = x; curY = y;
  const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
  sendInput({ type: 'click', x, y, button, clicks: 1 });
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (!hasFrame) return;
  e.preventDefault();
  sendInput({ type: 'scroll', dy: e.deltaY > 0 ? -3 : 3 });
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    if (wantConnected || connected) disconnect('紧急断开');
    return;
  }
  if (!hasFrame || e.target === roomInput) return;
  e.preventDefault();
  sendInput({ type: 'keydown', key: e.key });
}, true);
window.addEventListener('keyup', e => {
  if (e.key === 'Escape' || !hasFrame || e.target === roomInput) return;
  e.preventDefault();
  sendInput({ type: 'keyup', key: e.key });
}, true);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && wantConnected && (!wsMedia || wsMedia.readyState !== 1)) scheduleReconnect();
});
window.addEventListener('online', () => {
  if (wantConnected && (!wsCtrl || wsCtrl.readyState !== 1)) scheduleReconnect();
});

/* ===== 手机摇杆：多指互不干扰，点按键不归位摇杆 ===== */
let curX = 960, curY = 540;
(function setupTouch() {
  const joyBase = $('joyBase'), joyStick = $('joyStick');
  const btnLeft = $('btnLeft'), btnRight = $('btnRight');
  const scrollUp = $('scrollUp'), scrollDown = $('scrollDown');
  if (!joyBase) return;

  let joyTouchId = null;
  let joyDX = 0, joyDY = 0, joyRaf = null;
  const JOY_MAX = 52, JOY_SPEED = 16;

  function clamp() {
    curX = Math.max(0, Math.min((meta.width || 1920) - 1, curX));
    curY = Math.max(0, Math.min((meta.height || 1080) - 1, curY));
  }
  function sendPos() {
    clamp();
    sendInput({ type: 'mouse', x: Math.round(curX), y: Math.round(curY) });
  }
  function loop() {
    if (joyTouchId === null) { joyRaf = null; return; }
    if (Math.abs(joyDX) > 0.04 || Math.abs(joyDY) > 0.04) {
      curX += joyDX * JOY_SPEED;
      curY += joyDY * JOY_SPEED;
      sendPos();
    }
    joyRaf = requestAnimationFrame(loop);
  }
  function setStick(dx, dy) {
    const mag = Math.hypot(dx, dy) || 1;
    const c = Math.min(1, mag);
    joyDX = (dx / mag) * c;
    joyDY = (dy / mag) * c;
    joyStick.style.transform = 'translate(calc(-50% + ' + (joyDX * JOY_MAX) + 'px), calc(-50% + ' + (joyDY * JOY_MAX) + 'px))';
  }
  function endJoy() {
    joyTouchId = null;
    joyDX = joyDY = 0;
    joyStick.style.transform = 'translate(-50%, -50%)';
  }
  function point(e, id) {
    const touches = e.touches || e.changedTouches;
    if (touches) {
      for (let i = 0; i < touches.length; i++) {
        if (id == null || touches[i].identifier === id) return touches[i];
      }
    }
    return e;
  }
  function joyVec(e, id) {
    const t = point(e, id);
    if (!t) return { dx: 0, dy: 0 };
    const rect = joyBase.getBoundingClientRect();
    return {
      dx: (t.clientX - (rect.left + rect.width / 2)) / JOY_MAX,
      dy: (t.clientY - (rect.top + rect.height / 2)) / JOY_MAX
    };
  }

  joyBase.addEventListener('touchstart', e => {
    if (!hasFrame) return;
    // 只认第一根用于摇杆的手指
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    e.preventDefault();
    e.stopPropagation();
    setStick(joyVec(e, joyTouchId).dx, joyVec(e, joyTouchId).dy);
    if (!joyRaf) joyRaf = requestAnimationFrame(loop);
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (joyTouchId === null) return;
    let found = false;
    for (let i = 0; i < e.touches.length; i++) {
      if (e.touches[i].identifier === joyTouchId) { found = true; break; }
    }
    if (!found) return;
    e.preventDefault();
    const v = joyVec(e, joyTouchId);
    setStick(v.dx, v.dy);
  }, { passive: false, capture: true });

  window.addEventListener('touchend', e => {
    if (joyTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        endJoy();
        break;
      }
    }
  }, { capture: true });
  window.addEventListener('touchcancel', e => {
    if (joyTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) endJoy();
    }
  }, { capture: true });

  function bindBtn(el, button) {
    const fire = e => {
      e.preventDefault();
      e.stopPropagation();
      if (!hasFrame) return;
      el.classList.add('active');
      // 点击不改变摇杆状态，只用当前光标位置
      clamp();
      sendInput({ type: 'click', x: Math.round(curX), y: Math.round(curY), button, clicks: 1 });
    };
    const up = e => { if (e) e.preventDefault(); el.classList.remove('active'); };
    el.addEventListener('touchstart', fire, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', fire);
    el.addEventListener('mouseup', up);
  }
  bindBtn(btnLeft, 'left');
  bindBtn(btnRight, 'right');

  function bindScroll(el, dy) {
    el.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      if (!hasFrame) return;
      sendInput({ type: 'scroll', dy });
    }, { passive: false });
  }
  bindScroll(scrollUp, 3);
  bindScroll(scrollDown, -3);

  // 单指点画面定位（忽略摇杆/按钮区域）
  canvas.addEventListener('touchstart', e => {
    if (!hasFrame) return;
    const t = e.changedTouches[0];
    if (joyTouchId !== null && t.identifier === joyTouchId) return;
    const rect = canvas.getBoundingClientRect();
    curX = ((t.clientX - rect.left) * (canvas.width / rect.width)) / (meta.scale || 0.4);
    curY = ((t.clientY - rect.top) * (canvas.height / rect.height)) / (meta.scale || 0.4);
    sendPos();
  }, { passive: true });
})();
</script>
</body>
</html>
